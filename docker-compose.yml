x-app: &app
  build:
    context: .
  env_file:
    - .env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    LOG_DIR: /app/logs
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app_logs:/app/logs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  web:
    <<: *app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - static_data:/app/review_parser/staticfiles
      - app_logs:/app/logs

  celery:
    <<: *app
    command:
      - celery
      - -A
      - review_parser
      - worker
      - --loglevel=info
      - --concurrency=1
      - --max-tasks-per-child=50

  celery_beat:
    <<: *app
    command:
      - celery
      - -A
      - review_parser
      - beat
      - --loglevel=info
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - celery_beat_data:/var/lib/celery
      - app_logs:/app/logs

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro

volumes:
  postgres_data:
  redis_data:
  static_data:
  celery_beat_data:
  app_logs:
